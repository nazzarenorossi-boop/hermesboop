name: senler-io-user
title: Senler.io
repo: https://github.com/SenlerBot/senler-io-user-hermes-plugin
sha: 64dcbf492e2351fa5c9bc18a7510d355bacfa06f
description: "Connect your Senler.io account through MCP OAuth and automate selected webhook events with an outbound Relay connection. Disclosure — When you ask to connect, it adds a `senler-io-user` MCP server (mcp-senler-io-user.senler.io; OAuth handled by Hermes) to the profile's config.yaml, and Relay setup enables a `senler-io` gateway platform there. Once you enable automation, the gateway keeps an outbound WSS connection to a Senler-supplied Relay address and runs unattended agent turns on incoming Senler events (customer messages, leads, etc.); the platform is `trusted_inbound`, so these events bypass Hermes allowlists and pairing, and customer text reaches the model as untrusted data. During those runs a hook allows the Senler MCP and native tool discovery and pins customer replies to the event's dialog, but other Senler MCP writes run without a Hermes approval prompt, limited only by your saved instructions and your Senler account permissions. Relay credentials, instructions, event payloads and reports are stored unencrypted in `<HERMES_HOME>/senler-io-relay.sqlite3`; result reports (up to 16,000 characters) and this machine's hostname (as the Relay client name) are sent to Senler. Configured monitoring also stores notification recipients, queued texts and delivery receipts in that database; the selected native Hermes messaging adapter sends summaries and delivery-test messages to the saved recipient."
maintainer: SenlerBot
tier: community
category: automation
version: "0.5.1"
docs_url: https://github.com/SenlerBot/senler-io-user-hermes-plugin/blob/64dcbf492e2351fa5c9bc18a7510d355bacfa06f/README.md
image: https://raw.githubusercontent.com/SenlerBot/senler-io-user-hermes-plugin/64dcbf492e2351fa5c9bc18a7510d355bacfa06f/assets/catalog-banner.png
readme: true
known_issues:
  - "Preview: Windows Desktop sign-in is confirmed; a real Senler Relay workflow still needs end-to-end verification."
  - "Requires current Hermes with native MCP OAuth and Relay transport; gateway proxy mode and multiplexed profiles are unsupported."
  - "Monitoring notifications require a connected messaging channel; arbitrary Desktop/TUI chats are unsupported."
capabilities:
  provides_tools:
    - senler_connect
    - senler_relay
  provides_hooks:
    - pre_tool_call
    - on_session_end
  provides_middleware: []
  requires_env: []
requires_hermes: ">=0.21.6"
